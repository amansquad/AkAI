name: akai_app
description: Akai - A beautiful Android keyboard app.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.4

  # HTTP for downloading themes from GitHub
  http: ^1.2.0

  # For caching downloaded themes locally
  path_provider: ^2.1.2

  # On-device handwriting recognition (English + Amharic).
  # Pinned to 0.14.2: 0.15.0's Kotlin rewrite registers the Android channel as
  # "google_mlkit_digital_ink_recognition" while its Dart side calls
  # "google_mlkit_digital_ink_recognizer", so every call throws MissingPluginException.
  google_mlkit_digital_ink_recognition: 0.14.2
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/themes/
    - assets/themes/matrix.png
    - assets/akai-icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/akai-icon.png"
