apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.akai.nativekb"
    compileSdk = 36

    defaultConfig {
        // Its own id, so it installs next to the web-based AkAI keyboard
        // instead of replacing it.
        applicationId "com.akai.nativekb"
        minSdk = 24
        targetSdk = 36
        // Read by scripts/apk-info.mjs for the website's download button and
        // public/app-version.json, so the update check sees the same numbers.
        versionCode = 10003
        versionName = "1.0.3"
    }

    // Release signing reads keystore.properties (git-ignored) when it exists:
    //   storeFile=../my-release.jks  storePassword=...  keyAlias=...  keyPassword=...
    // Without it a release build is produced unsigned, never with a made-up key.
    def keystoreFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Shrinks the app and removes unused resources; the keyboard has no reflection to protect.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            // The handwriting recognizer is native code, 4-9 MB per CPU type.
            // Phones are arm, so the release ships only those two; debug builds
            // keep every type so the x86 emulator can run it too.
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.customview:customview:1.1.0'
    // On-device handwriting (English and Amharic); its models download on first use.
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    testImplementation 'junit:junit:4.13.2'
}
